<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RYOKIVA - Ajustes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0b1120 url("fondo.jpg") no-repeat center center fixed;background-size:cover;color:#fff;min-height:100vh;display:flex;flex-direction:column}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:15px 25px;background:rgba(11,17,32,0.85);border-bottom:1px solid rgba(255,255,255,0.1)}
.brand-badge{background:#e11d48;color:#fff;padding:6px 14px;border-radius:8px;font-weight:800}
.back-btn{background:rgba(30,41,59,0.8);border:1px solid rgba(255,255,255,0.1);color:#fff;padding:6px 14px;border-radius:8px;cursor:pointer;text-decoration:none}
.settings-container{display:grid;grid-template-columns:1fr 1.2fr;gap:25px;padding:25px;max-width:1100px;margin:0 auto;width:100%}
.qr-panel,.config-panel{background:rgba(15,23,42,0.88);border:1px solid rgba(255,255,255,0.12);border-radius:20px;padding:25px;backdrop-filter:blur(10px)}
.qr-panel{display:flex;flex-direction:column;align-items:center;text-align:center}
.qr-box{background:#fff;padding:12px;border-radius:16px;margin:15px 0}
.qr-img{width:160px;height:160px;display:block}
.input-field{width:100%;background:rgba(15,23,42,0.8);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:10px;border-radius:8px;font-size:0.9rem;outline:none;margin-top:5px}
.line-card{background:rgba(30,41,59,0.6);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:12px;margin-bottom:10px}
</style>
</head>
<body>
<div class="top-bar">
  <a href="index.html" class="back-btn" tabindex="0">← Volver al Menú</a>
  <div class="brand-badge">⚙️ AJUSTES Y CARGA M3U</div>
</div>
<div class="settings-container">
  <div class="qr-panel">
    <h3>Carga desde el Móvil</h3>
    <p style="color:#94a3b8;font-size:0.85rem;margin-top:5px">Escanea el QR para añadir listas M3U o Xtream Codes directamente desde tu teléfono.</p>
    <div class="qr-box">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=https://ryokiva.app/upload" class="qr-img" alt="QR">
    </div>
    <div style="font-size:0.85rem;color:#38bdf8;font-family:monospace">ryokiva.app/upload</div>
  </div>
  <div class="config-panel">
    <h3 style="margin-bottom:15px">Configuración de Líneas (Failover)</h3>
    <div class="line-card">
      <div style="font-weight:700;color:#e11d48;font-size:0.9rem">🟢 LÍNEA 1 (Principal)</div>
      <input type="text" class="input-field" placeholder="URL M3U / Xtream Server" tabindex="0">
    </div>
    <div class="line-card">
      <div style="font-weight:700;color:#eab308;font-size:0.9rem">🟡 LÍNEA 2 (Refuerzo 1)</div>
      <input type="text" class="input-field" placeholder="URL M3U / Xtream Server" tabindex="0">
    </div>
    <div class="line-card">
      <div style="font-weight:700;color:#ef4444;font-size:0.9rem">🔴 LÍNEA 3 (Refuerzo 2)</div>
      <input type="text" class="input-field" placeholder="URL M3U / Xtream Server" tabindex="0">
    </div>
    <button style="width:100%;background:#e11d48;color:#fff;border:none;padding:12px;border-radius:10px;font-weight:700;cursor:pointer;margin-top:10px" tabindex="0">💾 Guardar Líneas</button>
  </div>
</div>
</body>
</html>
