<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RYOKIVA</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,-apple-system,sans-serif;background:#0b1120 url("../fondo.jpg") no-repeat center center fixed;background-size:cover;color:#fff;min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;padding:25px}.top-bar{display:flex;justify-content:space-between;align-items:center;width:100%}.brand-badge{background:#e11d48;color:#fff;padding:6px 14px;border-radius:8px;font-weight:800}.main-dashboard{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;width:100%;max-width:1300px;margin:auto}.card{background:rgba(30,41,59,0.75);border:2px solid transparent;border-radius:16px;padding:35px 20px;text-align:center;cursor:pointer;outline:none}.card:focus,.card:hover{border-color:#e11d48;background:rgba(225,29,72,0.2);transform:scale(1.04)}.card-icon{font-size:3rem;margin-bottom:15px}.card-title{font-size:1.3rem;font-weight:700}</style></head><body><div class="top-bar"><div class="brand-badge">▶ RYOKIVA</div></div><div class="main-dashboard"><div class="card" tabindex="0"><div class="card-icon">📺</div><div class="card-title">TV en directo</div></div><div class="card" tabindex="0"><div class="card-icon">🎬</div><div class="card-title">Películas</div></div><div class="card" tabindex="0"><div class="card-icon">🎞️</div><div class="card-title">Series de televisión</div></div><div class="card" tabindex="0"><div class="card-icon">🔄</div><div class="card-title">Ponerme al día</div></div></div></body></html>
