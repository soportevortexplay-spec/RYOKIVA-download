<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RYOKIVA App</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,-apple-system,sans-serif;background:#0b1120 url("../fondo.jpg") no-repeat center center fixed;background-size:cover;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}.app-container{background:rgba(15,23,42,0.85);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:30px;width:100%;max-width:900px;text-align:center;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5)}.logo-title{font-size:2.5rem;font-weight:800;color:#38bdf8;margin-bottom:8px;letter-spacing:1px}.tagline{color:#94a3b8;font-size:1.1rem;margin-bottom:30px}.grid-profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:20px;margin-bottom:30px}.profile-card{background:rgba(30,41,59,0.7);border:2px solid transparent;border-radius:16px;padding:20px 10px;cursor:pointer;transition:all .2s ease;outline:none}.profile-card:focus,.profile-card:hover{border-color:#38bdf8;transform:scale(1.05);background:rgba(56,189,248,0.15)}.avatar{width:70px;height:70px;border-radius:50%;background:#0284c7;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:700}.profile-name{font-size:1rem;color:#f8fafc;font-weight:600}@media(min-width:768px){.app-container{padding:40px}.logo-title{font-size:3.2rem}.grid-profiles{grid-template-columns:repeat(5,1fr)}}</style></head><body><div class="app-container"><h1 class="logo-title">RYOKIVA</h1><p class="tagline">Tu futuro en tus manos — Selecciona tu Perfil</p><div class="grid-profiles"><div class="profile-card" tabindex="0"><div class="avatar">1</div><div class="profile-name">Principal</div></div><div class="profile-card" tabindex="0"><div class="avatar">2</div><div class="profile-name">Familiar</div></div><div class="profile-card" tabindex="0"><div class="avatar">3</div><div class="profile-name">Kids</div></div><div class="profile-card" tabindex="0"><div class="avatar">4</div><div class="profile-name">Invitado</div></div><div class="profile-card" tabindex="0"><div class="avatar" style="background:#334155">+</div><div class="profile-name">Añadir</div></div></div></div></body></html>
