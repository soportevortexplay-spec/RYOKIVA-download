<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RYOKIVA - Cuenta</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0b0f19; color: #fff; font-family: sans-serif; padding: 30px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
.card { background: #1e293b; border-radius: 16px; padding: 30px; width: 100%; max-width: 420px; border: 1px solid #334155; }
.title { font-size: 22px; color: #38bdf8; font-weight: bold; margin-bottom: 20px; text-align: center; }
.info-group { margin-bottom: 15px; background: #0f172a; padding: 12px 16px; border-radius: 8px; display: flex; justify-content: space-between; font-size: 14px; }
.label { color: #94a3b8; }
.value { font-weight: bold; color: #4ade80; }
.btn { width: 100%; background: #334155; border: 2px solid transparent; color: #fff; padding: 12px; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: bold; margin-top: 15px; }
.btn:focus, .btn:hover { border-color: #38bdf8; background: #0284c7; outline: none; }
</style>
<script src="api.js"></script>
</head><body>
<div class="card">
<div class="title">👑 Mi Suscripción RYOKIVA</div>
<div class="info-group"><span class="label">Plan Activo:</span><span class="value">Super VIP Premium</span></div>
<div class="info-group"><span class="label">Estado:</span><span class="value">Activo (365 días)</span></div>
<div class="info-group"><span class="label">Dispositivos:</span><span class="value">1 / 4 Activos</span></div>
<div class="info-group"><span class="label">ID TV:</span><span class="value" style="color:#fff;" id="dId">DEV-RYOKIVA</span></div>
<button class="btn" tabindex="1" onclick="location.href=\x27dashboard.html\x27">⬅ Volver al Menú</button>
</div>
<script>
window.onload = () => {
  const dev = localStorage.getItem("ryokiva_device") || "DEV-RYOKIVA-8821";
  document.getElementById("dId").innerText = dev;
  const btn = document.querySelector(".btn"); if(btn) btn.focus();
};
</script></body></html>
