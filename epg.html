<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RYOKIVA - Guía TV</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0b0f19; color: #fff; font-family: sans-serif; padding: 25px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
h1 { color: #38bdf8; font-size: 22px; }
.epg-grid { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; background: #1e293b; border-radius: 8px; overflow: hidden; align-items: center; border: 2px solid transparent; cursor: pointer; }
.row:focus, .row:hover { border-color: #38bdf8; background: #0284c7; outline: none; }
.ch { width: 130px; background: #0f172a; padding: 15px; font-weight: bold; text-align: center; font-size: 14px; }
.info { padding: 15px; flex: 1; }
.title { font-size: 15px; font-weight: bold; }
.time { font-size: 12px; color: #38bdf8; margin-top: 4px; }
</style>
<script src="api.js"></script>
</head><body>
<div class="header"><h1>📺 Guía de Programación (EPG)</h1><button style="background:#334155;color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;" tabindex="1" onclick="location.href=\x27dashboard.html\x27">⬅ Volver</button></div>
<div class="epg-grid" id="eBox"></div>
<script>
window.onload = () => {
  const e = [
    { c: "Movistar+", p: "El Clásico en Directo", t: "21:00 - 23:00" },
    { c: "La 1 HD", p: "Telediario 2", t: "21:00 - 22:00" },
    { c: "Antena 3", p: "El Hormiguero", t: "21:45 - 22:45" },
    { c: "HBO Max", p: "House of the Dragon", t: "22:00 - 23:10" }
  ];
  document.getElementById("eBox").innerHTML = e.map((item, i) => `
    <div class="row" tabindex="${i+2}" onclick="location.href=\x27reproductor.html\x27">
      <div class="ch">${item.c}</div>
      <div class="info"><div class="title">${item.p}</div><div class="time">EN DIRECTO • ${item.t}</div></div>
    </div>`
  ).join("");
  const f = document.querySelector(".row"); if(f) f.focus();
};
</script></body></html>
