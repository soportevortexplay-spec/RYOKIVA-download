<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RYOKIVA - Películas y Series</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0b1120 url("fondo.jpg") no-repeat center center fixed;background-size:cover;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:15px 25px;background:rgba(11,17,32,0.85);border-bottom:1px solid rgba(255,255,255,0.1)}
.brand-badge{background:#e11d48;color:#fff;padding:6px 14px;border-radius:8px;font-weight:800}
.back-btn{background:rgba(30,41,59,0.8);border:1px solid rgba(255,255,255,0.1);color:#fff;padding:6px 14px;border-radius:8px;cursor:pointer;text-decoration:none}
.vod-layout{display:flex;flex:1;height:calc(100vh - 70px);padding:20px;gap:20px}
.vod-sidebar{width:250px;background:rgba(15,23,42,0.85);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:15px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.vod-menu-item{padding:10px 14px;background:rgba(30,41,59,0.5);border-radius:8px;cursor:pointer;font-size:0.9rem;border:2px solid transparent;transition:all .2s;outline:none}
.vod-menu-item:focus,.vod-menu-item:hover{background:rgba(225,29,72,0.3);border-color:#e11d48}
.vod-content{flex:1;display:flex;flex-direction:column;gap:15px;overflow-y:auto}
.posters-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:15px}
.poster-card{background:rgba(30,41,59,0.7);border-radius:12px;overflow:hidden;border:2px solid transparent;cursor:pointer;transition:all .2s;outline:none}
.poster-card:focus,.poster-card:hover{border-color:#e11d48;transform:scale(1.05)}
.poster-img{width:100%;height:190px;background:#334155;display:flex;align-items:center;justify-content:center;font-size:0.85rem;color:#94a3b8}
.poster-title{padding:10px;font-size:0.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="top-bar">
  <a href="index.html" class="back-btn" tabindex="0">← Volver al Menú</a>
  <div class="brand-badge">🎬 PELÍCULAS Y SERIES</div>
</div>
<div class="vod-layout">
  <div class="vod-sidebar">
    <div class="vod-menu-item" tabindex="0">⭐ Top Valoradas</div>
    <div class="vod-menu-item" tabindex="0">❤️ Mis Favoritos</div>
    <div class="vod-menu-item" tabindex="0">🕒 Historial</div>
    <div class="vod-menu-item" tabindex="0">📂 Todo el Catálogo</div>
    <hr style="border-color:rgba(255,255,255,0.1);margin:5px 0">
    <div class="vod-menu-item" tabindex="0">🎭 Accion</div>
    <div class="vod-menu-item" tabindex="0">🚀 Ciencia Ficcion</div>
    <div class="vod-menu-item" tabindex="0">🍿 Comedia</div>
  </div>
  <div class="vod-content">
    <div style="font-weight:800;font-size:1.2rem;margin-bottom:5px">Añadidas Recientemente</div>
    <div class="posters-grid">
      <div class="poster-card" tabindex="0"><div class="poster-img">Póster 1</div><div class="poster-title">Spider-Man</div></div>
      <div class="poster-card" tabindex="0"><div class="poster-img">Póster 2</div><div class="poster-title">Inception</div></div>
      <div class="poster-card" tabindex="0"><div class="poster-img">Póster 3</div><div class="poster-title">Interstellar</div></div>
      <div class="poster-card" tabindex="0"><div class="poster-img">Póster 4</div><div class="poster-title">The Batman</div></div>
    </div>
  </div>
</div>
</body>
</html>
