<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RYOKIVA - VOD</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0b0f19; color: #fff; font-family: sans-serif; padding: 25px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
h1 { font-size: 22px; color: #38bdf8; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
.poster { background: #1e293b; height: 180px; border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border: 2px solid transparent; cursor: pointer; padding: 10px; }
.poster:focus, .poster:hover { border-color: #38bdf8; background: #0284c7; outline: none; }
</style>
<script src="api.js"></script>
</head><body>
<div class="header"><h1>🎬 Cine y Series (VOD)</h1><button style="background:#334155;color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;" tabindex="1" onclick="location.href=\x27dashboard.html\x27">⬅ Volver</button></div>
<div class="grid" id="vBox"></div>
<script>
window.onload = () => {
  const vods = [{t:"Estrenos 2026",i:"🍿"},{t:"Top Películas",i:"⭐"},{t:"Series Tendencia",i:"🔥"},{t:"Acción & Sci-Fi",i:"🚀"}];
  document.getElementById("vBox").innerHTML = vods.map((item, i) => `<div class="poster" tabindex="${i+2}" onclick="location.href=\x27reproductor.html\x27"><div style="font-size:36px;margin-bottom:8px;">${item.i}</div><div style="font-weight:bold;font-size:14px;">${item.t}</div></div>`).join("");
  const f = document.querySelector(".poster"); if(f) f.focus();
};
</script></body></html>
