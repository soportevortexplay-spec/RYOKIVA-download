<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RYOKIVA - Reproductor Smart TV</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #000; color: #fff; font-family: sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
video { width: 100%; height: 100%; object-fit: contain; position: absolute; top:0; left:0; z-index: 1; }
.osd { position: absolute; bottom: 0; left: 0; right: 0; z-index: 10; background: linear-gradient(transparent, rgba(0,0,0,0.95)); padding: 30px; display: flex; flex-direction: column; gap: 15px; opacity: 0; pointer-events: none; transition: opacity 0.4s ease; }
.osd.visible { opacity: 1; pointer-events: auto; }
.info h2 { font-size: 22px; color: #38bdf8; margin-bottom: 4px; }
.info p { font-size: 13px; color: #94a3b8; }
.progress-bar { width: 100%; background: rgba(255,255,255,0.2); height: 8px; border-radius: 4px; overflow: hidden; position: relative; }
.progress-fill { background: #38bdf8; width: 0%; height: 100%; transition: width 0.1s linear; }
.controls-row { display: flex; justify-content: space-between; align-items: center; }
.btn-group { display: flex; gap: 12px; }
.btn { background: #1e293b; border: 2px solid transparent; color: #fff; padding: 10px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
.btn:focus, .btn:hover { border-color: #38bdf8; background: #0284c7; outline: none; }
.time-display { font-size: 14px; color: #cbd5e1; font-family: monospace; }
</style>
<script src="api.js"></script>
</head><body>
<video id="myVideo" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" autoplay></video>
<div class="osd" id="osdBox">
<div class="info"><h2 id="cTitle">Canal / Vídeo en Directo</h2><p id="cSub">RYOKIVA • Transmisión HD</p></div>
<div class="progress-bar"><div class="progress-fill" id="pFill"></div></div>
<div class="controls-row">
<div class="btn-group">
<button class="btn" tabindex="1" onclick="history.back()">⬅ Volver</button>
<button class="btn" tabindex="2" onclick="rewind(10)">⏪ -10s</button>
<button class="btn" tabindex="3" id="playBtn" onclick="togglePlay()">⏸ Pausa</button>
<button class="btn" tabindex="4" onclick="forward(10)">⏩ +10s</button>
<button class="btn" tabindex="5" onclick="toggleMute()">🔊 Audio</button>
</div>
<div class="time-display" id="tDisp">00:00 / 00:00</div>
</div>
</div>
<script>
const v = document.getElementById("myVideo");
const osd = document.getElementById("osdBox");
const pFill = document.getElementById("pFill");
const tDisp = document.getElementById("tDisp");
const playBtn = document.getElementById("playBtn");
let hideTimer = null;
function showOSD() {
  osd.classList.add("visible");
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => { osd.classList.remove("visible"); }, 4000);
}
function togglePlay() { showOSD(); if(v.paused) { v.play(); playBtn.innerText="⏸ Pausa"; } else { v.pause(); playBtn.innerText="▶ Play"; } }
function rewind(s) { showOSD(); v.currentTime = Math.max(0, v.currentTime - s); }
function forward(s) { showOSD(); v.currentTime = Math.min(v.duration, v.currentTime + s); }
function toggleMute() { showOSD(); v.muted = !v.muted; }
function fmt(sec) { if(isNaN(sec)) return "00:00"; const m=Math.floor(sec/60), s=Math.floor(sec%60); return (m<10?"0":"")+m+":"+(s<10?"0":"")+s; }
v.addEventListener("timeupdate", () => {
  if(v.duration) {
    pFill.style.width = (v.currentTime / v.duration * 100) + "%";
    tDisp.innerText = fmt(v.currentTime) + " / " + fmt(v.duration);
  }
});
document.addEventListener("keydown", (e) => {
  showOSD();
  if(e.key==="ArrowLeft") rewind(10);
  else if(e.key==="ArrowRight") forward(10);
  else if(e.key==="Enter" || e.key===" ") { if(!osd.classList.contains("visible")) { playBtn.focus(); } }
});
window.onload = () => { showOSD(); document.getElementById("playBtn").focus(); };
</script></body></html>
