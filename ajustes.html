<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RYOKIVA - Ajustes</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0b0f19; color: #fff; font-family: sans-serif; padding: 25px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
h1 { font-size: 22px; color: #38bdf8; }
.opts { display: flex; flex-direction: column; gap: 12px; max-width: 500px; margin: 0 auto; }
.btn { background: #1e293b; padding: 16px; border-radius: 10px; border: 2px solid transparent; color: #fff; font-weight: bold; cursor: pointer; text-align: left; }
.btn:focus, .btn:hover { border-color: #38bdf8; background: #0284c7; outline: none; }
</style>
<script src="api.js"></script>
</head><body>
<div class="header"><h1>⚙️ Ajustes y Soporte</h1><button style="background:#334155;color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;" tabindex="1" onclick="location.href=\x27dashboard.html\x27">⬅ Volver</button></div>
<div class="opts">
<button class="btn" tabindex="2" onclick="alert(\x27Caché limpiada con éxito\x27)">🧹 Limpiar Caché y Canales</button>
<button class="btn" tabindex="3" onclick="location.href=\x27cuenta.html\x27">👑 Ver Suscripción</button>
<button class="btn" tabindex="4" onclick="alert(\x27Soporte enviado a RYOKIVA\x27)">📩 Contactar Soporte Técnico</button>
<button class="btn" tabindex="5" onclick="location.href=\x27index.html\x27" style="background:#7f1d1d;">🚪 Cerrar Sesión</button>
</div>
<script>
window.onload = () => { const f = document.querySelector(".btn"); if(f) f.focus(); };
</script></body></html>
