<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RYOKIVA - Categorías</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0b0f19; color: #fff; font-family: sans-serif; padding: 25px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
h1 { font-size: 22px; color: #38bdf8; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
.card { background: #1e293b; border-radius: 12px; padding: 20px; text-align: center; border: 2px solid transparent; cursor: pointer; }
.card:focus, .card:hover { border-color: #38bdf8; background: #0284c7; outline: none; }
</style>
<script src="api.js"></script>
</head><body>
<div class="header"><h1>📺 Categorías de TV</h1><button style="background:#334155;color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;" tabindex="1" onclick="location.href=\x27dashboard.html\x27">⬅ Volver</button></div>
<div class="grid" id="cBox"></div>
<script>
window.onload = () => {
  const cats = [{n:"Deportes",i:"⚽"},{n:"Cine",i:"🎬"},{n:"Noticias",i:"📰"},{n:"Infantil",i:"🧸"},{n:"Documentales",i:"🌍"}];
  document.getElementById("cBox").innerHTML = cats.map((item, i) => `<div class="card" tabindex="${i+2}" onclick="location.href=\x27reproductor.html\x27"><div style="font-size:32px;margin-bottom:8px;">${item.i}</div><div style="font-weight:bold;">${item.n}</div></div>`).join("");
  const f = document.querySelector(".card"); if(f) f.focus();
};
</script></body></html>
