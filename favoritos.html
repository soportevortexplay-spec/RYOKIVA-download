<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RYOKIVA - Favoritos</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0b0f19; color: #fff; font-family: sans-serif; padding: 25px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
h1 { font-size: 22px; color: #38bdf8; }
.list { display: flex; flex-direction: column; gap: 12px; }
.item { background: #1e293b; padding: 15px 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border: 2px solid transparent; cursor: pointer; }
.item:focus, .item:hover { border-color: #38bdf8; background: #0284c7; outline: none; }
</style>
<script src="api.js"></script>
</head><body>
<div class="header"><h1>⭐ Mis Canales Favoritos</h1><button style="background:#334155;color:#fff;border:none;padding:10px 18px;border-radius:8px;cursor:pointer;" tabindex="1" onclick="location.href=\x27dashboard.html\x27">⬅ Volver</button></div>
<div class="list" id="fBox"></div>
<script>
window.onload = () => {
  const favs = [{n:"La 1 HD",t:"TV"},{n:"Movistar Deportes",t:"Deportes"},{n:"HBO Max",t:"VOD"}];
  document.getElementById("fBox").innerHTML = favs.map((item, i) => `<div class="item" tabindex="${i+2}" onclick="location.href=\x27reproductor.html\x27"><div style="font-weight:bold;">${item.n}</div><div style="font-size:12px;color:#94a3b8;">${item.t}</div></div>`).join("");
  const f = document.querySelector(".item"); if(f) f.focus();
};
</script></body></html>
